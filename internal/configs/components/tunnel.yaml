# Tunnel Gateway 配置
tunnel:
  # Agent 连接监听地址
  # Agent 主动连接此地址注册服务
  listen_addr: ":7007"

  # HTTP 代理端口
  # 外部 HTTP 请求通过此端口访问已注册的服务
  # URL 格式: http://gateway:8888/{service_name}/path
  http_port: 8888

  # gRPC 代理端口
  # 外部 gRPC 请求通过此端口访问已注册的服务
  grpc_port: 9999

  # Debug 代理端口
  # 外部可通过此端口访问已注册服务的 debug 接口
  # URL 格式: http://gateway:6066/{service_name}/debug/pprof
  debug_port: 6066

# Tunnel Agent 配置 (用于服务端连接到 Gateway)
tunnel_agent:
  enabled: true
  gateway_addr: "localhost:7007"
  service_addr: ":8082"
