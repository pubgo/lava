OPENAI_API_KEY:
  desc: "OpenAI API Key"
  validate: "required"
OPENAI_BASE_URL:
  desc: "OpenAI Base URL"
  default: "https://api.example.com/v1"
OPENAI_MODEL:
  desc: "OpenAI Model"
  default: "example-model"
ENABLE_DEBUG:
  desc: "enable debug"
  default: "false"
DB_DSN:
  desc: "db dsn"
  default: "host=localhost dbname=app port=5432 user=postgres password=changeme sslmode=disable"
ENV:
  desc: app env
  default: dev
CATDOGS_BASIC_AUTH_PASSWD:
  desc: basic auth password
  default: "changeme"
GOOGLE_CALLBACK_URL:
  desc: "google callback url"
  default: "http://localhost:8080/auth/google/callback"
LOG_LEVEL:
  desc: "log level"
  default: "debug"

LOG_AS_JSON:
  desc: "log as json"
  default: "false"
NATS_URL:
  desc: nats url
NATS_POOL_WORKER_SIZE:
  desc: nats pool worker size
  default: "1000"
NATS_POOL_QUEUE_SIZE:
  desc: nats pool queue size
  default: 1000
NATS_ENABLE_IGNORE:
  desc: nats enable ignore
  default: true

REDIS_ADDR:
  desc: redis address
  default: "localhost:6379"

REDIS_PWD:
  desc: redis password
  default: "changeme"
