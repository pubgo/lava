syntax = "proto3";

package grpcweb.example.v1;

option go_package = "github.com/pubgo/lava/v2/internal/examples/grpcweb/proto;greeterpb";

import "google/api/annotations.proto";

// GreeterService 提供简单的问候服务，用于测试 gRPC Web 实现
service GreeterService {
  // SayHello 返回问候语
  rpc SayHello(HelloRequest) returns (HelloResponse) {
    option (google.api.http) = {
      post: "/v1/greeter/hello"
      body: "*"
    };
  }

  // SayGoodbye 返回告别语
  rpc SayGoodbye(GoodbyeRequest) returns (GoodbyeResponse) {
    option (google.api.http) = {
      post: "/v1/greeter/goodbye"
      body: "*"
    };
  }

  // WatchHello 服务端流式返回多条问候（用于 WebSocket / server-stream 演示）
  rpc WatchHello(WatchHelloRequest) returns (stream HelloResponse) {
    option (google.api.http) = {
      post: "/v1/greeter/watch"
      body: "*"
    };
  }

  // Chat 双向流式对话（用于 WebSocket / bidi 演示）
  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {
    option (google.api.http) = {
      post: "/v1/greeter/chat"
      body: "*"
    };
  }
}

// HelloRequest 是 SayHello 的请求消息
message HelloRequest {
  // 用户名称
  string name = 1;
}

// HelloResponse 是 SayHello 的响应消息
message HelloResponse {
  // 问候消息
  string message = 1;
  // 服务器时间戳
  int64 timestamp = 2;
}

// GoodbyeRequest 是 SayGoodbye 的请求消息
message GoodbyeRequest {
  // 用户名称
  string name = 1;
}

// GoodbyeResponse 是 SayGoodbye 的响应消息
message GoodbyeResponse {
  // 告别消息
  string message = 1;
  // 服务器时间戳
  int64 timestamp = 2;
}

// WatchHelloRequest 是 WatchHello 的请求消息
message WatchHelloRequest {
  // 用户名称
  string name = 1;
  // 推送消息条数，默认 3
  int32 count = 2;
}

// ChatMessage 是 Chat 双向流的消息
message ChatMessage {
  string text = 1;
}
