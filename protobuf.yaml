checksum: 7f555863b95ad4a996e27e61329c4b13e5f5e4a2
vendor: .proto
base:
  out: ./pkg
  paths: import
  module: github.com/pubgo/lava/pkg
root:
  - proto
includes:
  - proto
deps:
  - name: google
    url: github.com/googleapis/googleapis
    path: /google
    version: v0.0.0-20220224004616-3c171936039b
  - name: google/protobuf
    url: /usr/local/include/google/protobuf
    optional: true
  - name: google/protobuf
    url: /opt/homebrew/include/google/protobuf
    optional: true
  - name: errorpb
    url: github.com/pubgo/funk/v2
    path: /proto/errorpb
    version: v2.0.0-alpha.10
plugins:
  - name: go
  - name: go-errors2
  - name: go-grpc
    opt:
      - require_unimplemented_servers=false
