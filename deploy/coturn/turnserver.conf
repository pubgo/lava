# lava P2P coturn — deploy to dev (118.178.168.253)
# relay ports: 10000-20000

listening-port=3478
listening-ip=0.0.0.0

# 阿里云 ECS：公网 IP 不在网卡上，必须 bind 私网 IP 并用 external-ip 做 公网/私网 映射。
# 否则 relay socket 无法在公网 IP 上 bind，返回 508 Cannot create socket。
external-ip=118.178.168.253/172.27.55.124
relay-ip=172.27.55.124

min-port=10000
max-port=20000

fingerprint
lt-cred-mech
realm=lava.dev

# 开发环境：静态长期凭证（与 core/p2p/config.go DefaultConfig 一致）
user=lava:lava-p2p-dev

# 生产环境：改用 HMAC 临时凭证（注释上一行 user=，启用下面两行，并与 P2P_TURN_SECRET 保持一致）
# use-auth-secret
# static-auth-secret=change-me-in-production

no-cli
no-tls
no-dtls

verbose
