# https://taskfile.dev

version: "3"

dotenv: [".env"]
vars:
  Project: "lava"
  Base: "github.com/pubgo/funk/v2"
  VERSION:
    sh: "git tag --sort=committerdate | tail -n 1"
  BUILD_TIME:
    sh: "date -u '+%Y-%m-%d %I:%M:%S %Z'"
  GIT_COMMIT:
    sh: "git rev-parse --short=8 HEAD"
  BRANCH_NAME:
    sh: "git branch ch --show-current"
  GIT_VERSION:
    sh: "git describe --always --abbrev=7 --dirty"

includes:
  scheduler: ./internal/examples/scheduler
  tunnel: ./internal/examples/tunnel

tasks:
  default:
    desc: "default task"
    cmds:
      - task -a

  info:
    cmds:
      - echo "Project {{.Project}}"
      - echo "VERSION {{.VERSION}}"
      - echo "GIT_VERSION {{.GIT_VERSION}}"
    silent: true

  tools:
    cmds:
      - go install github.com/cortesi/modd/cmd/modd@latest
      - go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - go install mvdan.cc/sh/v3/cmd/gosh@latest
      - go install github.com/DarthSim/overmind/v2@latest
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install golang.org/x/tools/cmd/goimports@latest

  generate:
    cmds:
      - go generate ./internal/...

  proto:fmt:
    cmds:
      - protobuild format

  proto:gen:
    cmds:
      - go install ./tools/protoc-gen-zrpc-go
      - protobuild vendor
      - protobuild gen

  proto:lint:
    cmds:
      - protobuild lint

  vet:
    desc: "go vet"
    cmds:
      - go vet ./...
  test:
    cmds:
      - go test -short -race -v ./... -cover
  lint:
    cmds:
      - golangci-lint run --verbose ./...

  release:snapshot:
    desc: "build protoc-gen-zrpc-go release artifacts locally"
    cmds:
      - goreleaser release --snapshot --clean

  changelog:
    desc: "generate changelog with git-cliff"
    cmds:
      - git cliff -o .version/changelog/CHANGELOG.md

  changelog:unreleased:
    desc: "preview unreleased changelog"
    cmds:
      - git cliff --unreleased

  changelog:sync:
    desc: "refresh Unreleased.md from git-cliff (review before commit)"
    cmds:
      - git cliff --unreleased --strip header -o .version/changelog/Unreleased.md
